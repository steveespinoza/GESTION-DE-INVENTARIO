name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · compilación
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend · PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventario_ci
          POSTGRES_PASSWORD: inventario_ci
          POSTGRES_DB: inventario_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U inventario_ci -d inventario_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar la suite
        env:
          TEST_DATABASE_URL: postgresql://inventario_ci:inventario_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/inventario_test
        run: python -m pytest -q -rs

  browser:
    name: Navegador · recorrido de inventario
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventario_ci
          POSTGRES_PASSWORD: inventario_ci
          POSTGRES_DB: inventario_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U inventario_ci -d inventario_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python -m pip install -r backend/requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Ejecutar el recorrido en Chromium
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://inventario_ci:inventario_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/inventario_test
        run: python -m pytest -q -rs e2e
